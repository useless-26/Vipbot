<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZIPUSH - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #060811;
            color: #c8d4f0;
            font-family: 'JetBrains Mono', monospace;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.12;
            pointer-events: none;
            animation: drift 15s ease-in-out infinite alternate;
        }
        .blob-1 { width: 500px; height: 500px; background: #00f5ff; top: -150px; left: -150px; }
        .blob-2 { width: 400px; height: 400px; background: #ff2d78; bottom: -100px; right: -100px; }
        .blob-3 { width: 300px; height: 300px; background: #b44dff; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        @keyframes drift {
            from { transform: translate(0, 0) scale(1); }
            to { transform: translate(30px, 20px) scale(1.08); }
        }
        .login-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            padding: 20px;
        }
        .login-box {
            background: rgba(12, 16, 32, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 24px;
            padding: 40px;
            animation: fadeUp 0.6s ease both;
        }
        .login-box::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 24px;
            padding: 1px;
            background: linear-gradient(135deg, rgba(0,245,255,0.2), transparent, rgba(255,45,120,0.15));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }
        .login-box .logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .login-box .logo-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #00f5ff, #b44dff);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin: 0 auto 12px;
            box-shadow: 0 0 40px rgba(0,245,255,0.3);
        }
        .login-box .logo-text {
            font-family: 'Syne', sans-serif;
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(90deg, #00f5ff, #ff2d78, #ffb830);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .login-box .logo-sub {
            font-size: 11px;
            color: #4a5578;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-top: 4px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            font-size: 11px;
            font-weight: 700;
            color: #4a5578;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            display: block;
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            background: #111828;
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
            color: #c8d4f0;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            padding: 12px 16px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-group input:focus {
            border-color: rgba(0,245,255,0.4);
            box-shadow: 0 0 0 4px rgba(0,245,255,0.06);
        }
        .form-group input::placeholder {
            color: #4a5578;
            font-size: 12px;
        }
        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            font-weight: 800;
            background: linear-gradient(135deg, #00f5ff, #b44dff, #ff2d78);
            color: #000;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 0.1em;
            margin-top: 8px;
        }
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 40px rgba(0,245,255,0.3);
        }
        .login-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .register-link {
            text-align: center;
            margin-top: 16px;
            font-size: 12px;
            color: #4a5578;
        }
        .register-link a {
            color: #00f5ff;
            text-decoration: none;
            border-bottom: 1px solid rgba(0,245,255,0.3);
        }
        .register-link a:hover {
            border-bottom-color: #00f5ff;
        }
        .error-msg {
            background: rgba(255,45,120,0.1);
            border: 1px solid rgba(255,45,120,0.2);
            border-radius: 10px;
            padding: 10px 14px;
            color: #ff2d78;
            font-size: 12px;
            margin-bottom: 16px;
            display: none;
        }
        .error-msg.show { display: block; }
        .register-section {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }
        .register-section .form-row {
            display: flex;
            gap: 8px;
        }
        .register-section .form-row input {
            flex: 1;
        }
        .register-section .form-row .reg-btn {
            padding: 12px 20px;
            border: 1px solid rgba(0,245,255,0.2);
            background: rgba(0,245,255,0.05);
            color: #00f5ff;
            border-radius: 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .register-section .form-row .reg-btn:hover {
            background: rgba(0,245,255,0.1);
            border-color: rgba(0,245,255,0.4);
        }
        .register-section .hint {
            font-size: 10px;
            color: #4a5578;
            margin-top: 6px;
        }
        .register-section .hint code {
            color: #00f5ff;
            background: rgba(0,245,255,0.05);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @media (max-width: 480px) {
            .login-box { padding: 24px; }
            .register-section .form-row { flex-wrap: wrap; }
            .register-section .form-row .reg-btn { width: 100%; }
        }
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(12,16,32,0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
            padding: 16px 24px;
            max-width: 380px;
            z-index: 999;
            animation: slideIn 0.4s ease;
        }
        .toast.success { border-color: rgba(13,255,140,0.3); }
        .toast.error { border-color: rgba(255,45,120,0.3); }
        .toast .toast-title { font-weight: 700; font-size: 13px; margin-bottom: 4px; }
        .toast .toast-msg { font-size: 12px; color: #8a9bb8; }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }
    </style>
</head>
<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <div class="login-container">
        <div class="login-box">
            <div class="logo">
                <div class="logo-icon">⚡</div>
                <div class="logo-text">ZIPUSH</div>
                <div class="logo-sub">GitHub Deployer</div>
            </div>

            <div id="error-msg" class="error-msg"></div>

            <!-- Login -->
            <div id="login-form">
                <div class="form-group">
                    <label><i class="fas fa-user"></i> Username</label>
                    <input type="text" id="login-username" placeholder="Enter username" />
                </div>
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Password</label>
                    <input type="password" id="login-password" placeholder="Enter password" />
                </div>
                <button class="login-btn" id="login-btn" onclick="login()">
                    <i class="fas fa-sign-in-alt"></i> LOGIN
                </button>
            </div>

            <!-- Register -->
            <div class="register-section">
                <div style="text-align:center;font-size:11px;color:#4a5578;margin-bottom:10px;">
                    <i class="fas fa-user-plus"></i> New user? Register below
                </div>
                <div class="form-row">
                    <input type="text" id="reg-username" placeholder="Username" style="flex:1;" />
                    <input type="password" id="reg-password" placeholder="Password" style="flex:1;" />
                </div>
                <div style="margin-top:6px;display:flex;gap:8px;">
                    <input type="text" id="reg-key" placeholder="API Key (optional for VIP)" style="flex:1;background:#111828;border:1px solid rgba(255,255,255,0.06);border-radius:12px;color:#c8d4f0;font-family:'JetBrains Mono',monospace;font-size:12px;padding:10px 14px;outline:none;" />
                    <button class="reg-btn" onclick="register()"><i class="fas fa-user-plus"></i> Register</button>
                </div>
                <div class="hint">
                    <i class="fas fa-info-circle"></i> Default: <code>admin</code> / <code>admin123</code>
                    &nbsp;|&nbsp; Use API key for VIP access
                </div>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>

    <script>
        const API = window.location.origin;

        function showToast(title, message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <div class="toast-title">${title}</div>
                <div class="toast-msg">${message}</div>
            `;
            container.appendChild(toast);
            setTimeout(() => { toast.remove(); }, 4000);
        }

        function showError(msg) {
            const el = document.getElementById('error-msg');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 5000);
        }

        async function login() {
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value.trim();
            
            if (!username || !password) {
                showError('Please fill in all fields');
                return;
            }
            
            const btn = document.getElementById('login-btn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> LOGGING IN...';
            btn.disabled = true;
            
            try {
                const res = await fetch(`${API}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (data.success) {
                    showToast('✅ Welcome back!', 'Redirecting to dashboard...', 'success');
                    setTimeout(() => { window.location.href = '/dashboard'; }, 500);
                } else {
                    showError(data.error || 'Login failed');
                    btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> LOGIN';
                    btn.disabled = false;
                }
            } catch (e) {
                showError('Network error: ' + e.message);
                btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> LOGIN';
                btn.disabled = false;
            }
        }

        async function register() {
            const username = document.getElementById('reg-username').value.trim();
            const password = document.getElementById('reg-password').value.trim();
            const apiKey = document.getElementById('reg-key').value.trim();
            
            if (!username || !password) {
                showError('Username and password required');
                return;
            }
            
            try {
                const res = await fetch(`${API}/api/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, api_key: apiKey })
                });
                const data = await res.json();
                if (data.success) {
                    showToast('✅ Registered!', `${data.is_vip ? '🎉 VIP Access granted! ' : ''}Please login now.`, 'success');
                    document.getElementById('reg-username').value = '';
                    document.getElementById('reg-password').value = '';
                    document.getElementById('reg-key').value = '';
                } else {
                    showError(data.error || 'Registration failed');
                }
            } catch (e) {
                showError('Network error: ' + e.message);
            }
        }

        // Enter key support
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                if (document.activeElement.id === 'login-username' || 
                    document.activeElement.id === 'login-password') {
                    login();
                }
                if (document.activeElement.id === 'reg-username' || 
                    document.activeElement.id === 'reg-password' ||
                    document.activeElement.id === 'reg-key') {
                    register();
                }
            }
        });
    </script>
</body>
</html>
